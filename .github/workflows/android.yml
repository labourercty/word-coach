name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Check web files
        run: npm run build

      - name: Create the Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync www into Android
        run: npx cap sync android

      - name: Inject AdMob app id and version code
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/>\n    </application>#" "$MANIFEST"
          fi
          grep -n "APPLICATION_ID" "$MANIFEST"
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" "$GRADLE"
          grep -n "versionCode" "$GRADLE"

      - name: Add release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Add the secret KEYSTORE_BASE64 first"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          GRADLE=android/app/build.gradle
          sed -i '/release {/a\            signingConfig signingConfigs.release' "$GRADLE"
          cat > /tmp/signing.txt <<'EOF'
              signingConfigs {
                  release {
                      storeFile file("upload.keystore")
                      storePassword System.getenv("KEY_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          EOF
          sed -i '/^android {/r /tmp/signing.txt' "$GRADLE"
          grep -n "signingConfig" "$GRADLE"

      - name: Build release AAB
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
