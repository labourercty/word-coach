name: Make upload key (run once)
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the upload key
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "Add the secret KEYSTORE_PASSWORD first"; exit 1; fi
          keytool -genkeypair -storetype PKCS12 -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Word Coach, O=Word Coach, C=IN"
          base64 -w0 upload.keystore > keystore.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upload-key
          path: |
            upload.keystore
            keystore.base64.txt
          retention-days: 1
          
