name: Unpack zip (run once)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into the repo
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Unpacking $ZIP"
          unzip -o "$ZIP" -x ".github/*" -d .
          rm -f "$ZIP"
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add Word Coach Capacitor project" || echo "Nothing to commit"
          git push
